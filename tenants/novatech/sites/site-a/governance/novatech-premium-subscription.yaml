---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: novatech-premium-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: novatech-premium-users
  modelRefs:
    - name: facebook-opt-125m
      namespace: ai-grid-internal-models
      tokenRateLimits:
        - limit: 50000
          window: 1m
    - name: granite-remote
      namespace: external-models
      tokenRateLimits:
        - limit: 50000
          window: 1m
  priority: 20
