---
# Pass-through governance for cross-cluster consumers accessing the simulated model from site-b (site-b-cluster).
# system:authenticated allows any consumer cluster SA to mint an API key on site-a (hub).
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: facebook-cross-cluster-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: facebook-opt-125m
      namespace: ai-grid-internal-models
  subjects:
    groups:
      - name: system:authenticated
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: facebook-cross-cluster-sub
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: system:authenticated
  modelRefs:
    - name: facebook-opt-125m
      namespace: ai-grid-internal-models
      tokenRateLimits:
        - limit: 999999999
          window: 1m
  priority: 1
