---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: facebook-cross-cluster-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: facebook-opt-125m-grid
      namespace: models-as-a-service
  subjects:
    groups:
      - name: system:authenticated
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: facebook-cross-cluster-sub
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: system:authenticated
  modelRefs:
    - name: facebook-opt-125m-grid
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 999999999
          window: 1m
  priority: 1
