---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: novatech-free-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: novatech-free-users
  modelRefs:
    - name: facebook-opt-125m-grid
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100
          window: 1m
    - name: smollm2-135m-instruct-grid
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100
          window: 1m
  priority: 10
