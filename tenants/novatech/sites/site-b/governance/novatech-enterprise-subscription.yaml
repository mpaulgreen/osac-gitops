---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: novatech-enterprise-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: novatech-enterprise-users
  modelRefs:
    - name: facebook-opt-125m-grid
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: smollm2-135m-instruct-grid
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 30
