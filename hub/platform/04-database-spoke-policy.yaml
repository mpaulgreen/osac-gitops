---
# Spoke-only Placement — excludes hub (local-cluster)
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: osac-spoke-only
  namespace: osac-platform
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: NotIn
              values:
                - local-cluster
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-database-spoke
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Spoke read-replica: a single-instance CNPG Cluster streaming from the
      hub primary via Submariner cross-cluster DNS. Replication TLS certs are
      distributed from the hub.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Replication TLS secrets (hub → spoke) ──────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-database-replication-secrets
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{hub- $repl := (lookup "v1" "Secret" "osac-platform" "maas-db-replication-mirror") hub}}
            {{hub- $ca   := (lookup "v1" "Secret" "osac-platform" "maas-db-ca-mirror") hub}}
            {{hub- if and $repl $ca hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-replication
                  namespace: maas-db
                type: kubernetes.io/tls
                data:
                  tls.key: '{{hub fromSecret "osac-platform" "maas-db-replication-mirror" "tls.key" hub}}'
                  tls.crt: '{{hub fromSecret "osac-platform" "maas-db-replication-mirror" "tls.crt" hub}}'
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-ca
                  namespace: maas-db
                type: Opaque
                data:
                  ca.crt: '{{hub fromSecret "osac-platform" "maas-db-ca-mirror" "ca.crt" hub}}'
            {{hub- end hub}}

    # ── Read-replica CNPG Cluster ──────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-cnpg-read-replica
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                metadata:
                  name: maas-read
                  namespace: maas-db
                spec:
                  instances: 1
                  bootstrap:
                    pg_basebackup:
                      database: maas
                      owner: maas_api
                      secret:
                        name: maas-db-app
                      source: maas-db
                  replica:
                    enabled: true
                    source: maas-db
                  externalClusters:
                    - name: maas-db
                      connectionParameters:
                        host: maas-db-rw.maas-db.svc.clusterset.local
                        user: streaming_replica
                        sslmode: verify-full
                        dbname: postgres
                      sslKey:
                        name: maas-db-replication
                        key: tls.key
                      sslCert:
                        name: maas-db-replication
                        key: tls.crt
                      sslRootCert:
                        name: maas-db-ca
                        key: ca.crt
                  storage:
                    size: 20Gi
                  resources:
                    requests:
                      cpu: 250m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 4Gi
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: osac-database-spoke-binding
  namespace: osac-platform
placementRef:
  name: osac-spoke-only
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: osac-database-spoke
    apiGroup: policy.open-cluster-management.io
    kind: Policy
