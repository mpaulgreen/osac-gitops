---
# Policy 08 — Cross-site ExternalProvider API key distribution (platform plane).
#
# Mint the key ONCE on the upstream, store it in ONE hub Secret in osac-platform.
# This policy distributes it to the consumer clusters, and ONLY once that hub
# Secret exists:
#
#   osac-platform/granite-remote-upstream-key   api-key=<minted on site-b>
#   osac-platform/facebook-remote-upstream-key  api-key=<minted on the hub>
#
# (created by the operator, never in Git; see install.md, step "Register the keys")
#
# Scope: this policy owns the namespace and the credential Secret only. The
# ExternalProvider / ExternalModel / MaaSModelRef objects are intent and belong to
# Argo CD (global/sites/<site>/external-models/). A policy never touches them.
#
# Before the key exists:
# - Template 1 renders only the Namespace (the hub-template guard is false), so
#   there is no template error and no Secret.
# - Template 2 (inform) is NonCompliant with an explicit "awaiting credential"
#   message. When the key is distributed it turns Compliant.
#
# Template rules:
# - The guard uses a hub-template lookup in the policy namespace (osac-platform), so
#   no service account is needed. The Secret VALUE still comes from fromSecret, so
#   ACM encrypts it in the replicated policy. Never print $k.data.
# - Do not set spec.remediationAction on a Policy here: it overrides every template
#   and would turn the inform check into enforce. Set it per template.
# - pruneObjectBehavior None: removing a consumer never deletes what exists (B-8).
#
# A consumer's ExternalProvider checks its Secret once and retries on backoff, so a
# provider created before the key waits minutes. The recheck CronJob shipped in each
# external-models Argo layer (provider-recheck.yaml) wakes it once the Secret exists.
#
# To add a consumer for granite: add its name to the osac-granite-consumers Placement.
# To add a consumer for facebook: add its name to the osac-facebook-consumers Placement.

# ── granite: consumer local-cluster (site-a), upstream site-b ───────────────
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-granite-consumer-secrets
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-granite-remote-secret
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: None
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: external-models
                  labels:
                    opendatahub.io/generated-namespace: "true"
                    maas.opendatahub.io/gateway-access: "true"
            {{hub $k := (lookup "v1" "Secret" "osac-platform" "granite-remote-upstream-key") hub}}
            {{hub if (and $k $k.data (hasKey $k.data "api-key")) hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: granite-remote-key
                  namespace: external-models
                  labels:
                    inference.llm-d.ai/ipp-managed: "true"
                    inference.networking.k8s.io/bbr-managed: "true"
                type: Opaque
                data:
                  api-key: '{{hub fromSecret "osac-platform" "granite-remote-upstream-key" "api-key" hub}}'
            {{hub end hub}}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-granite-remote-key-delivered
        spec:
          remediationAction: inform
          severity: low
          customMessage:
            noncompliant: "Awaiting credential: external-models/granite-remote-key is not delivered. Usually the hub Secret osac-platform/granite-remote-upstream-key does not exist yet (install.md, step Register the keys)."
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: granite-remote-key
                  namespace: external-models
---
# Placement: granite consumers — currently the hub (local-cluster).
# Add more cluster names to extend to additional consumers.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: osac-granite-consumers
  namespace: osac-platform
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - local-cluster
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: osac-granite-secret-binding
  namespace: osac-platform
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: osac-granite-consumers
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: osac-granite-consumer-secrets
---
# ── facebook: consumer site-b (site-b-cluster), upstream local-cluster (site-a) ───
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-facebook-consumer-secrets
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-facebook-remote-secret
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: None
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: external-models
                  labels:
                    opendatahub.io/generated-namespace: "true"
                    maas.opendatahub.io/gateway-access: "true"
            {{hub $k := (lookup "v1" "Secret" "osac-platform" "facebook-remote-upstream-key") hub}}
            {{hub if (and $k $k.data (hasKey $k.data "api-key")) hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: facebook-remote-key
                  namespace: external-models
                  labels:
                    inference.llm-d.ai/ipp-managed: "true"
                    inference.networking.k8s.io/bbr-managed: "true"
                type: Opaque
                data:
                  api-key: '{{hub fromSecret "osac-platform" "facebook-remote-upstream-key" "api-key" hub}}'
            {{hub end hub}}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-facebook-remote-key-delivered
        spec:
          remediationAction: inform
          severity: low
          customMessage:
            noncompliant: "Awaiting credential: external-models/facebook-remote-key is not delivered. Usually the hub Secret osac-platform/facebook-remote-upstream-key does not exist yet (install.md, step Register the keys)."
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: facebook-remote-key
                  namespace: external-models
---
# Placement: facebook consumers — currently site-b (site-b-cluster).
# Add more cluster names to extend to additional consumers.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: osac-facebook-consumers
  namespace: osac-platform
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - site-b
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: osac-facebook-secret-binding
  namespace: osac-platform
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: osac-facebook-consumers
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: osac-facebook-consumer-secrets
