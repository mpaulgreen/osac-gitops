---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-grid-gateway
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Deploys the praxis consumer and provider gateways on each site.
      The consumer gateway routes MaaS requests to grid backends; the
      provider gateway serves local models to remote peers via mutual TLS.
      Both use per-site identity from grid-site-identity / grid-ca.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Consumer Gateway ───────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-consumer-gateway
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: grid-gateway
                  namespace: redhat-ai-grid
                  labels:
                    app: grid-gateway
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: grid-gateway
                  template:
                    metadata:
                      labels:
                        app: grid-gateway
                    spec:
                      serviceAccountName: grid-model-client
                      containers:
                        - name: gateway
                          image: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:17b43cd1aeeb879c20c069774391eecd09f48d8920b2262000726ff401a7f54b
                          args:
                            - --config
                            - /etc/praxis/config/praxis.yaml
                          ports:
                            - name: https
                              containerPort: 8443
                            - name: metrics
                              containerPort: 9443
                          env:
                            - name: PRAXIS_CONFIG_SOURCE
                              value: render
                            - name: PRAXIS_ROLE
                              value: consumer
                            - name: PRAXIS_AUTH_MODE
                              value: none
                            - name: PRAXIS_GRID_NETWORK_NAME
                              value: grid
                            - name: PRAXIS_GRID_GATEWAY_NAME
                              value: grid-gateway
                          volumeMounts:
                            - name: tls-identity
                              mountPath: /etc/praxis/tls
                              readOnly: true
                            - name: listener-tls
                              mountPath: /etc/praxis/listener-tls
                              readOnly: true
                            - name: praxis-config
                              mountPath: /etc/praxis/config
                              readOnly: true
                            - name: routing-overlay
                              mountPath: /etc/praxis/routing
                              readOnly: true
                      volumes:
                        - name: tls-identity
                          projected:
                            sources:
                              - secret:
                                  name: grid-site-identity
                              - secret:
                                  name: grid-ca
                        - name: listener-tls
                          secret:
                            secretName: grid-gateway-listener-tls
                        - name: praxis-config
                          configMap:
                            name: praxis-consumer-config
                        - name: routing-overlay
                          configMap:
                            name: grid-overlay-grid-grid-gateway
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-gateway
                  namespace: redhat-ai-grid
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
                    service.beta.kubernetes.io/aws-load-balancer-type: nlb
                spec:
                  type: LoadBalancer
                  selector:
                    app: grid-gateway
                  ports:
                    - name: https
                      port: 443
                      targetPort: https
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-gateway-metrics
                  namespace: redhat-ai-grid
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: grid-gateway-metrics-tls
                spec:
                  selector:
                    app: grid-gateway
                  ports:
                    - name: metrics
                      port: 9443
                      targetPort: metrics

    # ── Provider Gateway ───────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-provider-gateway
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: praxis-provider-config
                  namespace: redhat-ai-grid
                data:
                  praxis.yaml: |
                    insecure_options:
                      allow_private_endpoints: true
                      allow_tls_no_verify: true
                    listeners:
                    - name: provider
                      address: 0.0.0.0:8443
                      filter_chains:
                      - provider-chain
                      tls:
                        certificates:
                        - cert_path: /etc/praxis/tls/tls.crt
                          key_path: /etc/praxis/tls/tls.key
                        client_ca:
                          ca_path: /etc/praxis/tls/ca.crt
                        client_cert_mode: require
                    filter_chains:
                    - name: provider-chain
                      filters:
                      - filter: json_body_field
                        field: model
                        header: X-Model
                      - filter: router
                        routes:
                        - path_prefix: "/"
                          cluster: local-passthrough
                      - filter: load_balancer
                        clusters:
                        - name: local-passthrough
                          tls:
                            verify: false
                          endpoints:
                          - '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-provider-backend" .ManagedClusterName) hub}}'
                    admin:
                      metrics_address: "127.0.0.1:9901"
                    shutdown_timeout_secs: 30
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: grid-provider-gateway
                  namespace: redhat-ai-grid
                  labels:
                    app: grid-provider-gateway
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: grid-provider-gateway
                  template:
                    metadata:
                      labels:
                        app: grid-provider-gateway
                    spec:
                      containers:
                        - name: gateway
                          image: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:17b43cd1aeeb879c20c069774391eecd09f48d8920b2262000726ff401a7f54b
                          args:
                            - --config
                            - /etc/praxis/config/praxis.yaml
                          ports:
                            - name: https
                              containerPort: 8443
                          env:
                            - name: PRAXIS_CONFIG_SOURCE
                              value: render
                            - name: PRAXIS_ROLE
                              value: provider
                            - name: PRAXIS_PEER_TRUST_MODE
                              value: spiffe
                            - name: PRAXIS_PEER_SPIFFE_IDS
                              value: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-peer-spiffe-ids" .ManagedClusterName) hub}}'
                            - name: PRAXIS_TRUST_PRIVATE
                              value: "true"
                          volumeMounts:
                            - name: tls-identity
                              mountPath: /etc/praxis/tls
                              readOnly: true
                            - name: praxis-config
                              mountPath: /etc/praxis/config
                              readOnly: true
                      volumes:
                        - name: tls-identity
                          projected:
                            sources:
                              - secret:
                                  name: grid-site-identity
                              - secret:
                                  name: grid-ca
                        - name: praxis-config
                          configMap:
                            name: praxis-provider-config
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-provider-gateway
                  namespace: redhat-ai-grid
                spec:
                  selector:
                    app: grid-provider-gateway
                  ports:
                    - name: https
                      port: 443
                      targetPort: https
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: grid-provider-gateway
                  namespace: redhat-ai-grid
                  annotations:
                    haproxy.router.openshift.io/timeout: 300s
                spec:
                  host: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-route-host" .ManagedClusterName) hub}}'
                  to:
                    kind: Service
                    name: grid-provider-gateway
                  port:
                    targetPort: https
                  tls:
                    termination: passthrough

    # ── Provider gateway NetworkPolicy ─────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-gateway-network-policy
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: grid-provider-gateway
                  namespace: redhat-ai-grid
                spec:
                  podSelector:
                    matchLabels:
                      app: grid-provider-gateway
                  ingress:
                    - from:
                        - podSelector:
                            matchLabels:
                              grid.opendatahub.io/gateway-client: "true"
                        - namespaceSelector:
                            matchLabels:
                              network.openshift.io/policy-group: ingress
                      ports:
                        - port: 8443
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: grid-consumer-gateway
                  namespace: redhat-ai-grid
                spec:
                  podSelector:
                    matchLabels:
                      app: grid-gateway
                  ingress:
                    - ports:
                        - port: 8443
                          protocol: TCP
