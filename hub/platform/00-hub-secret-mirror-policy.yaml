---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-hub-secret-mirror
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Hub-only: mirrors secrets from maas-db and redhat-ai-grid namespaces
      into osac-platform so that hub-template fromSecret in spoke policies
      can reference them without cross-namespace access (the propagator's
      hub-template engine restricts fromSecret to the policy namespace).
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Mirror database replication secrets ─────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-mirror-db-replication-secrets
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $repl := lookup "v1" "Secret" "maas-db" "maas-db-replication" }}
            {{- $ca   := lookup "v1" "Secret" "maas-db" "maas-db-ca" }}
            {{- if $repl }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-replication-mirror
                  namespace: osac-platform
                  labels:
                    osac.io/mirror-source: maas-db
                type: kubernetes.io/tls
                data:
                  tls.key: '{{ index $repl.data "tls.key" }}'
                  tls.crt: '{{ index $repl.data "tls.crt" }}'
            {{- end }}
            {{- if $ca }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-ca-mirror
                  namespace: osac-platform
                  labels:
                    osac.io/mirror-source: maas-db
                type: Opaque
                data:
                  ca.crt: '{{ index $ca.data "ca.crt" }}'
            {{- end }}

    # ── Mirror grid swim-key secret ─────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-mirror-grid-swim-key
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $swimKey := lookup "v1" "Secret" "redhat-ai-grid" "grid-swim-key" }}
            {{- if $swimKey }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-swim-key-mirror
                  namespace: osac-platform
                  labels:
                    osac.io/mirror-source: redhat-ai-grid
                type: Opaque
                data:
                  key: '{{ index $swimKey.data "key" }}'
            {{- end }}

    # ── Mirror grid enrollment invite tokens ───────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-mirror-grid-invite-tokens
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $invite := lookup "v1" "Secret" "grid-enrollment-invites" "grid-invite-site-b" }}
            {{- if $invite }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-invite-site-b-mirror
                  namespace: osac-platform
                  labels:
                    osac.io/mirror-source: grid-enrollment-invites
                type: Opaque
                data:
                  token: '{{ index $invite.data "token" }}'
            {{- end }}

    # ── Mirror hub service-CA cert ────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-mirror-hub-service-ca
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $cm := lookup "v1" "ConfigMap" "openshift-config-managed" "openshift-service-ca.crt" }}
            {{- if $cm }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: hub-service-ca-mirror
                  namespace: osac-platform
                  labels:
                    osac.io/mirror-source: openshift-config-managed
                type: Opaque
                data:
                  ca.crt: '{{ index $cm.data "service-ca.crt" | base64enc }}'
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: osac-hub-secret-mirror
  namespace: osac-platform
placementRef:
  name: osac-hub-only
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: osac-hub-secret-mirror
    apiGroup: policy.open-cluster-management.io
    kind: Policy
