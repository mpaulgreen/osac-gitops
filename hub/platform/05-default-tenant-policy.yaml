---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-default-tenant
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Creates the AITenant, MaasTenantConfig, and all governance/model/grid
      namespaces for the RHOAI 3.6 MaaS platform. Replaces the 3.5.1
      Tenant CR.
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: osac-hub-templating
  policy-templates:
    # ── Namespaces ──────────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-tenant-namespaces
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: models-as-a-service
                  labels:
                    osac.io/governance: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: ai-tenants
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: ai-grid-internal-models
                  labels:
                    grid.opendatahub.io/allowed: "true"
                    osac.io/models: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ai-grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: grid-model-client
                  namespace: redhat-ai-grid
                automountServiceAccountToken: false
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-model-client-token
                  namespace: redhat-ai-grid
                  annotations:
                    kubernetes.io/service-account.name: grid-model-client
                type: kubernetes.io/service-account-token

    # ── AITenant (replaces Tenant from 3.5.1) ───────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-aitenant-config
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: AITenant
                metadata:
                  name: models-as-a-service
                  namespace: ai-tenants
                spec:
                  gateway:
                    name: maas-default-gateway
                  oidc:
                    accessTokenPurpose: access
                    accessTokenPurposeClaim: token_use
                    clientId: tenant-demo
                    audience: tenant-demo
                    issuerUrl: '{{hub printf "https://%s/realms/saas" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host hub}}'

    # ── MaasTenantConfig ────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-maas-tenant-config
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaasTenantConfig
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service
                spec:
                  telemetry:
                    enabled: true
                    metrics:
                      captureModelUsage: true
                      captureUser: true
                      captureGroup: true
                      captureOrganization: true

