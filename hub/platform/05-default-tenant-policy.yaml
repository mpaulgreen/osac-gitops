---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-default-tenant
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Creates the governance namespace and the single default tenant (B-14).
      All OSAC tenants share this tenant, gateway and namespace; isolation is
      through governance (subscriptions + auth policies), not tenant separation.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Governance namespace ────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-governance-namespace
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: models-as-a-service
                  labels:
                    osac.io/governance: "true"

    # ── Default tenant ──────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-tenant-config
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: Tenant
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service
                spec:
                  gatewayRef:
                    name: maas-default-gateway
                    namespace: openshift-ingress
                  externalOIDC:
                    clientId: osac-cli   #REPLACE-ME
                    issuerUrl: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.identity-issuer" .ManagedClusterName) hub}}'
                  telemetry:
                    enabled: true
                    metrics:
                      captureOrganization: true
                      captureUser: true
                      captureGroup: true
                      captureModelUsage: true

    # ── Model namespace ─────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-model-namespace
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: maas-models
                  labels:
                    osac.io/models: "true"
