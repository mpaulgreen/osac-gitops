---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-observability
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Configures observability for the MaaS platform: ScrapeConfigs for
      grid, grid-operator, epp, vllm, gpu-platform, and rhai metrics;
      ServiceAccounts and ClusterRoleBindings for metrics readers;
      NetworkPolicy for ACM observability agents to reach the RHOAI
      OTel collector. UWM and GPU ScrapeConfigs deploy in redhat-ai-grid
      (all clusters) so MCO spoke collectors forward custom metrics to
      hub Thanos without relying on the custom-allowlist ConfigMap
      propagation (broken under MCOA).
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Metrics reader RBAC ────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-observability-rbac
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            # EPP metrics reader
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: grid-epp-metrics-reader
                  namespace: redhat-ai-grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-epp-metrics-reader-token
                  namespace: redhat-ai-grid
                  annotations:
                    kubernetes.io/service-account.name: grid-epp-metrics-reader
                type: kubernetes.io/service-account-token
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: grid-epp-metrics-reader
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: kserve-metrics-reader-cluster-role
                subjects:
                  - kind: ServiceAccount
                    name: grid-epp-metrics-reader
                    namespace: redhat-ai-grid
            # UWM federate reader (all clusters — needed for vllm-metrics
            # ScrapeConfig to read recording rules from UWM Prometheus)
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: grid-uwm-federate-reader
                  namespace: redhat-ai-grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-uwm-federate-reader-token
                  namespace: redhat-ai-grid
                  annotations:
                    kubernetes.io/service-account.name: grid-uwm-federate-reader
                type: kubernetes.io/service-account-token
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: grid-uwm-federate-reader
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-monitoring-view
                subjects:
                  - kind: ServiceAccount
                    name: grid-uwm-federate-reader
                    namespace: redhat-ai-grid

    # ── UWM federate reader RBAC (ACM observability namespace) ─────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-observability-rbac-acm
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- if (lookup "v1" "Namespace" "" "open-cluster-management-observability") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: grid-uwm-federate-reader
                  namespace: open-cluster-management-observability
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-uwm-federate-reader-token
                  namespace: open-cluster-management-observability
                  annotations:
                    kubernetes.io/service-account.name: grid-uwm-federate-reader
                type: kubernetes.io/service-account-token
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: grid-uwm-federate-reader
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-monitoring-view
                subjects:
                  - kind: ServiceAccount
                    name: grid-uwm-federate-reader
                    namespace: open-cluster-management-observability
            {{- end }}

    # ── ScrapeConfigs ──────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-observability-scrapeconfigs
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            # Grid gateway metrics
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: grid-metrics
                  namespace: redhat-ai-grid
                  labels:
                    app.kubernetes.io/component: user-workload-metrics-collector
                spec:
                  jobName: grid-metrics
                  metricsPath: /metrics
                  scrapeInterval: 30s
                  scheme: HTTPS
                  metricRelabelings:
                    - sourceLabels: [cluster]
                      regex: (.+)
                      targetLabel: backend
                      action: replace
                  tlsConfig:
                    ca:
                      configMap:
                        name: openshift-service-ca.crt
                        key: service-ca.crt
                    serverName: grid-gateway-metrics.redhat-ai-grid.svc
                  staticConfigs:
                    - targets:
                        - grid-gateway-metrics.redhat-ai-grid.svc:9443
            # Grid operator metrics
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: grid-operator-metrics
                  namespace: redhat-ai-grid
                  labels:
                    app.kubernetes.io/component: user-workload-metrics-collector
                spec:
                  jobName: grid-operator-metrics
                  metricsPath: /metrics
                  scrapeInterval: 30s
                  scheme: HTTPS
                  tlsConfig:
                    ca:
                      configMap:
                        name: openshift-service-ca.crt
                        key: service-ca.crt
                    serverName: grid-operator-metrics.redhat-ai-grid.svc
                  staticConfigs:
                    - targets:
                        - grid-operator-metrics.redhat-ai-grid.svc:9090
            # EPP metrics
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: epp-metrics
                  namespace: redhat-ai-grid
                  labels:
                    app.kubernetes.io/component: user-workload-metrics-collector
                spec:
                  jobName: epp-metrics
                  metricsPath: /metrics
                  scrapeInterval: 30s
                  scheme: HTTP
                  authorization:
                    credentials:
                      name: grid-epp-metrics-reader-token
                      key: token
                  staticConfigs:
                    - targets:
                        - facebook-opt-125m-epp-service.ai-grid-internal-models.svc:9090
            # vLLM/KServe recording rules + EPP metrics (UWM federate)
            # Deployed in redhat-ai-grid so spokes pick it up via MCO
            # PrometheusAgent (MCOA doesn't propagate custom-allowlist).
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: uwm-federate-metrics
                  namespace: redhat-ai-grid
                  labels:
                    app.kubernetes.io/component: user-workload-metrics-collector
                spec:
                  jobName: uwm-federate-metrics
                  metricsPath: /federate
                  scrapeInterval: 30s
                  scheme: HTTPS
                  params:
                    match[]:
                      - '{__name__=~"(vllm|kserve_vllm):.*"}'
                      - '{__name__=~"llm_d_epp_.*|praxis_workload_status|http_requests_total"}'
                  authorization:
                    credentials:
                      name: grid-uwm-federate-reader-token
                      key: token
                  tlsConfig:
                    ca:
                      configMap:
                        name: openshift-service-ca.crt
                        key: service-ca.crt
                    serverName: prometheus-user-workload.openshift-user-workload-monitoring.svc
                  staticConfigs:
                    - targets:
                        - prometheus-user-workload.openshift-user-workload-monitoring.svc:9092
            # GPU and accelerator metrics (platform Prometheus federate)
            # Must be in open-cluster-management-agent-addon: the platform
            # PrometheusAgent has no scrapeConfigNamespaceSelector, so it
            # only discovers ScrapeConfigs in its own namespace.
            # scheme: HTTPS required — port 9091 is behind kube-rbac-proxy;
            # auth and TLS CA come from the PrometheusAgent default endpoint.
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: gpu-platform-metrics
                  namespace: open-cluster-management-agent-addon
                  labels:
                    app.kubernetes.io/component: platform-metrics-collector
                spec:
                  jobName: gpu-platform-metrics
                  metricsPath: /federate
                  scrapeInterval: 60s
                  scheme: HTTPS
                  params:
                    match[]:
                      - '{__name__=~"DCGM_FI_DEV_GPU_UTIL|DCGM_FI_DEV_GPU_TEMP|DCGM_FI_DEV_FB_USED|DCGM_FI_DEV_FB_FREE"}'
                      - '{__name__=~"accelerator_gpu_utilization|cluster:usage:consumption:rhods:gpu:.*"}'
                  staticConfigs:
                    - targets:
                        - prometheus-k8s.openshift-monitoring.svc:9091

    # ── ScrapeConfigs for ACM observability namespace (hub-only) ──────
    # rhai-metrics targets the OTel collector which only runs on hub.
    # vllm-metrics moved to redhat-ai-grid (all-clusters) above.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-observability-scrapeconfigs-acm
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- if (lookup "v1" "Namespace" "" "open-cluster-management-observability") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: rhai-metrics
                  namespace: open-cluster-management-observability
                  labels:
                    app.kubernetes.io/component: user-workload-metrics-collector
                spec:
                  jobName: rhai-metrics
                  metricsPath: /metrics
                  scheme: HTTP
                  staticConfigs:
                    - targets:
                        - data-science-collector-monitoring.redhat-ods-monitoring.svc:8890
            {{- end }}

    # ── NetworkPolicy for ACM observability agents ─────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-observability-network-policy
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: allow-acm-rhai-metrics
                  namespace: redhat-ods-monitoring
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
                      app.kubernetes.io/component: opentelemetry-collector
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management-agent-addon
                      ports:
                        - port: 8890
                          protocol: TCP
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: allow-acm-grid-metrics
                  namespace: redhat-ai-grid
                spec:
                  podSelector: {}
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management-agent-addon
                      ports:
                        - port: 9443
                          protocol: TCP
                        - port: 9090
                          protocol: TCP
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: allow-acm-pool-metrics
                  namespace: ai-grid-internal-models
                spec:
                  podSelector: {}
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management-agent-addon
                      ports:
                        - port: 9090
                          protocol: TCP
                        - port: 8000
                          protocol: TCP
