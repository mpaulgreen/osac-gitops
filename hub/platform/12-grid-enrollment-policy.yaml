---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-grid-enrollment
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Hub-only: creates the grid-enrollment-invites namespace, ServiceExport
      for the grid-enrollment service, and declared peers (GridSite +
      InferenceProvider) for sites that cannot discover each other via gossip.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Enrollment Service NetworkPolicy ──────────────────────────────
    # The namespace-wide allow-acm-grid-metrics policy (podSelector: {})
    # default-denies all ingress except ACM metrics ports.  The enrollment
    # service must be reachable on 8443 from the OpenShift router (Route
    # passthrough) and from Submariner traffic (cross-cluster).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-netpol
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: allow-grid-enrollment
                  namespace: redhat-ai-grid
                spec:
                  podSelector:
                    matchLabels:
                      app: grid-enrollment
                  policyTypes:
                    - Ingress
                  ingress:
                    - ports:
                        - port: 8443
                          protocol: TCP
                        - port: 8080
                          protocol: TCP
                      from:
                        - namespaceSelector:
                            matchLabels:
                              network.openshift.io/policy-group: ingress
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: submariner-operator
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: redhat-ai-grid

    # ── grid-enrollment-invites namespace ───────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-namespace
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: grid-enrollment-invites

    # ── Enrollment Service RBAC ────────────────────────────────────────
    # The enrollment binary watches SiteInvites (cluster-scoped), manages
    # invite-token Secrets, and updates SiteInvite status.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-rbac
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: grid-enrollment
                rules:
                  - apiGroups: ["grid.praxis.fast"]
                    resources: ["siteinvites"]
                    verbs: ["get", "list", "watch", "update", "patch"]
                  - apiGroups: ["grid.praxis.fast"]
                    resources: ["siteinvites/status"]
                    verbs: ["get", "update", "patch"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: grid-enrollment
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: grid-enrollment
                subjects:
                  - kind: ServiceAccount
                    name: grid-enrollment
                    namespace: redhat-ai-grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                metadata:
                  name: grid-enrollment-secrets
                  namespace: grid-enrollment-invites
                rules:
                  - apiGroups: [""]
                    resources: ["secrets"]
                    verbs: ["get", "list", "watch", "create", "update", "delete"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: grid-enrollment-secrets
                  namespace: grid-enrollment-invites
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: grid-enrollment-secrets
                subjects:
                  - kind: ServiceAccount
                    name: grid-enrollment
                    namespace: redhat-ai-grid

    # ── Grid Enrollment Service ───────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-service
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: PersistentVolumeClaim
                metadata:
                  name: grid-enrollment-db
                  namespace: redhat-ai-grid
                  annotations:
                    argocd.argoproj.io/sync-options: Prune=false,Delete=false
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: grid-enrollment
                  template:
                    metadata:
                      labels:
                        app: grid-enrollment
                    spec:
                      serviceAccountName: grid-enrollment
                      containers:
                        - name: enrollment
                          image: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9@sha256:6dcbefe9f5496b014d4d588ec2bc3e295f6fbd3e1c5f2418145672476731b905
                          ports:
                            - name: https
                              containerPort: 8443
                          env:
                            - name: RUST_LOG
                              value: info
                            - name: GRID_NETWORK
                              value: grid
                            - name: ENROLLMENT_DB_TYPE
                              value: builtin
                            - name: ENROLLMENT_DB_PATH
                              value: /var/lib/enrollment/db
                            - name: ENROLLMENT_CA_CERT
                              value: /etc/grid-ca/ca.crt
                            - name: ENROLLMENT_CA_KEY
                              value: /etc/grid-ca/ca.key
                            - name: ENROLLMENT_TLS_CERT
                              value: /etc/enrollment-tls/tls.crt
                            - name: ENROLLMENT_TLS_KEY
                              value: /etc/enrollment-tls/tls.key
                            - name: ENROLLMENT_AUTHZ
                              value: kube
                            - name: ENROLLMENT_HUB_SITE_NAME
                              value: local-cluster
                            - name: ENROLLMENT_HUB_NAMESPACE
                              value: redhat-ai-grid
                            - name: ENROLLMENT_HUB_IDENTITY_SECRET
                              value: grid-site-identity
                            - name: ENROLLMENT_HUB_CA_SECRET
                              value: grid-ca
                            - name: ENROLLMENT_HUB_SWIM_KEY_SECRET
                              value: grid-swim-key
                            - name: ENROLLMENT_HUB_SEED_SECRET
                              value: grid-reserved-seeds
                            - name: ENROLLMENT_INVITE_SECRET_NAMESPACE
                              value: grid-enrollment-invites
                          volumeMounts:
                            - name: db
                              mountPath: /var/lib/enrollment/db
                            - name: grid-ca
                              mountPath: /etc/grid-ca
                              readOnly: true
                            - name: enrollment-tls
                              mountPath: /etc/enrollment-tls
                              readOnly: true
                      volumes:
                        - name: db
                          persistentVolumeClaim:
                            claimName: grid-enrollment-db
                        - name: grid-ca
                          secret:
                            secretName: grid-ca
                        - name: enrollment-tls
                          secret:
                            secretName: grid-enrollment-tls
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
                spec:
                  selector:
                    app: grid-enrollment
                  ports:
                    - name: https
                      port: 8443
                      targetPort: https
    # ── Enrollment Route (passthrough) ──────────────────────────────
    # The enrollment TLS cert is now signed by the grid CA with SANs
    # for both internal DNS and the Route hostname, so passthrough works
    # and the spoke operator sees the grid-CA-signed cert directly.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-route
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
                spec:
                  host: '{{hub fromConfigMap "osac-platform" "osac-site-params" "local-cluster.grid-enrollment-host" hub}}'
                  to:
                    kind: Service
                    name: grid-enrollment
                  port:
                    targetPort: https
                  tls:
                    termination: passthrough

    # ── Hub enrollment CA (local lookup, no hub-template addon) ────────
    # object-templates-raw with {{hub ... hub}} requires the
    # governance-standalone-hub-templating addon on local-cluster.
    # Instead, the hub creates grid-enrollment-ca directly via lookup.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-hub-enrollment-ca
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $gridCA := lookup "v1" "Secret" "redhat-ai-grid" "grid-ca" }}
            {{- if $gridCA }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-enrollment-ca
                  namespace: redhat-ai-grid
                  labels:
                    grid.praxis.fast/signer-bundle: "true"
                type: Opaque
                data:
                  ca.crt: '{{ index $gridCA.data "ca.crt" }}'
            {{- end }}

    # ── ServiceExport for grid-enrollment ──────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-service-export
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "serviceexports.multicluster.x-k8s.io") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: multicluster.x-k8s.io/v1alpha1
                kind: ServiceExport
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
            {{- end }}

    # ── SiteInvite: site-b ───────────────────────────────────────────
    # Creates a long-lived enrollment invitation for site-b. The spoke's
    # grid operator uses the generated token to enroll with the hub and
    # receive its identity certificate.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-site-invite-site-b
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: SiteInvite
                metadata:
                  name: site-b
                spec:
                  siteName: site-b
                  lifetime: 168h
                  jurisdictions:
                    - default

    # ── Declared peer: site-b ──────────────────────────────────────────
    # The hub declares known peers so the grid gateway can route to them
    # even without gossip. Add more GridSite + InferenceProvider pairs
    # for additional sites.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-declared-peers
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: GridSite
                metadata:
                  name: site-b
                  labels:
                    grid.hexfusion.io/declared-peer: "true"
                spec:
                  gridNetworkRef: grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: InferenceProvider
                metadata:
                  name: peer-site-b-granite-8b
                spec:
                  gridNetworkRef: grid
                  providerKind: vllm
                  backendKind: local_model
                  clusterName: peer-site-b
                  endpoint: 'https://maas.{{hub fromConfigMap "osac-platform" "osac-site-params" "site-b.cluster-domain" hub}}:443/v1'
                  siteSelector:
                    matchLabels:
                      grid.hexfusion.io/declared-peer: "true"
                  models:
                    - name: granite-3.1-8b-instruct-fp8
                      capabilities:
                        - text_generation
