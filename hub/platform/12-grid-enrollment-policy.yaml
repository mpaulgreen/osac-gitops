---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-grid-enrollment
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Hub-only: creates the grid-enrollment-invites namespace, ServiceExport
      for the grid-enrollment service, and declared peers (GridSite +
      InferenceProvider) for sites that cannot discover each other via gossip.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── grid-enrollment-invites namespace ───────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-namespace
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: grid-enrollment-invites

    # ── Grid Operator RBAC supplement ─────────────────────────────────
    # The AIGateway controller creates ClusterRole grid-operator-resources
    # but omits list/watch on configmaps and secrets (RHOAI 3.6 bug).
    # A separate ClusterRole+Binding avoids being overwritten by the
    # AIGateway reconciler.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-operator-rbac
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: osac-grid-operator-supplement
                rules:
                  - apiGroups: [""]
                    resources: ["configmaps", "secrets"]
                    verbs: ["list", "watch"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: osac-grid-operator-supplement
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: osac-grid-operator-supplement
                subjects:
                  - kind: ServiceAccount
                    name: grid-operator
                    namespace: redhat-ai-grid

    # ── Grid Enrollment Service ───────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-service
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: PersistentVolumeClaim
                metadata:
                  name: grid-enrollment-db
                  namespace: redhat-ai-grid
                  annotations:
                    argocd.argoproj.io/sync-options: Prune=false,Delete=false
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: grid-enrollment
                  template:
                    metadata:
                      labels:
                        app: grid-enrollment
                    spec:
                      containers:
                        - name: enrollment
                          image: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9@sha256:6dcbefe9f5496b014d4d588ec2bc3e295f6fbd3e1c5f2418145672476731b905
                          ports:
                            - name: https
                              containerPort: 8443
                          env:
                            - name: ENROLLMENT_DB_TYPE
                              value: builtin
                            - name: ENROLLMENT_DB_PATH
                              value: /var/lib/enrollment/db
                            - name: ENROLLMENT_CA_CERT
                              value: /etc/grid-ca/ca.crt
                            - name: ENROLLMENT_CA_KEY
                              value: /etc/grid-ca/ca.key
                            - name: ENROLLMENT_TLS_CERT
                              value: /etc/enrollment-tls/tls.crt
                            - name: ENROLLMENT_TLS_KEY
                              value: /etc/enrollment-tls/tls.key
                            - name: ENROLLMENT_AUTHZ
                              value: kube
                            - name: ENROLLMENT_HUB_SITE_NAME
                              value: local-cluster
                            - name: ENROLLMENT_HUB_NAMESPACE
                              value: redhat-ai-grid
                            - name: ENROLLMENT_HUB_IDENTITY_SECRET
                              value: grid-site-identity
                            - name: ENROLLMENT_HUB_CA_SECRET
                              value: grid-ca
                            - name: ENROLLMENT_HUB_SWIM_KEY_SECRET
                              value: grid-swim-key
                            - name: ENROLLMENT_HUB_SEED_SECRET
                              value: grid-reserved-seeds
                            - name: ENROLLMENT_INVITE_NAMESPACE
                              value: grid-enrollment-invites
                          volumeMounts:
                            - name: db
                              mountPath: /var/lib/enrollment/db
                            - name: grid-ca
                              mountPath: /etc/grid-ca
                              readOnly: true
                            - name: enrollment-tls
                              mountPath: /etc/enrollment-tls
                              readOnly: true
                      volumes:
                        - name: db
                          persistentVolumeClaim:
                            claimName: grid-enrollment-db
                        - name: grid-ca
                          secret:
                            secretName: grid-ca
                        - name: enrollment-tls
                          secret:
                            secretName: grid-enrollment-tls
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: grid-enrollment-tls
                spec:
                  selector:
                    app: grid-enrollment
                  ports:
                    - name: https
                      port: 8443
                      targetPort: https
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
                spec:
                  host: '{{hub fromConfigMap "osac-platform" "osac-site-params" "local-cluster.grid-enrollment-host" hub}}'
                  to:
                    kind: Service
                    name: grid-enrollment
                  port:
                    targetPort: https
                  tls:
                    termination: passthrough

    # ── ServiceExport for grid-enrollment ──────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-service-export
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "serviceexports.multicluster.x-k8s.io") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: multicluster.x-k8s.io/v1alpha1
                kind: ServiceExport
                metadata:
                  name: grid-enrollment
                  namespace: redhat-ai-grid
            {{- end }}

    # ── SiteInvite: site-b ───────────────────────────────────────────
    # Creates a long-lived enrollment invitation for site-b. The spoke's
    # grid operator uses the generated token to enroll with the hub and
    # receive its identity certificate.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-site-invite-site-b
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: SiteInvite
                metadata:
                  name: site-b
                  namespace: grid-enrollment-invites
                spec:
                  siteName: site-b
                  lifetime: 168h

    # ── Declared peer: site-b ──────────────────────────────────────────
    # The hub declares known peers so the grid gateway can route to them
    # even without gossip. Add more GridSite + InferenceProvider pairs
    # for additional sites.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-declared-peers
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: GridSite
                metadata:
                  name: site-b
                  labels:
                    grid.hexfusion.io/declared-peer: "true"
                spec:
                  gridNetworkRef: grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: InferenceProvider
                metadata:
                  name: peer-site-b-opt-125m
                spec:
                  gridNetworkRef: grid
                  providerKind: vllm
                  backendKind: local_model
                  clusterName: peer-site-b
                  endpoint: 'https://maas.{{hub fromConfigMap "osac-platform" "osac-site-params" "site-b.cluster-domain" hub}}:443/v1'
                  siteSelector:
                    matchLabels:
                      grid.hexfusion.io/declared-peer: "true"
                  models:
                    - name: facebook-opt-125m
                      capabilities:
                        - text_generation
