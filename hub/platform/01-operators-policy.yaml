---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-operators
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Installs the operator stack required by the MaaS platform on each spoke.
      RHOAI 3.6 with AI Grid on OCP 4.20+. Service Mesh is Sail-embedded.
      RHCL auto-installs Authorino, Limitador, and DNS as OLM dependencies.
      CloudNativePG, External Secrets, and Redis operators added for 3.6.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Group A: cert-manager + RHCL ───────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-a
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            # cert-manager
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: cert-manager-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: cert-manager-operator
                  namespace: cert-manager-operator
                spec: {}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  channel: stable-v1.18
                  name: openshift-cert-manager-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic
            # kuadrant-system hosts the Kuadrant and Authorino CRs (policies 03, 07).
            # RHCL is installed HERE (not in openshift-operators) to avoid OLM InstallPlan
            # conflict: the OpenShift ingress operator creates a Manual-approval servicemesh
            # Subscription in openshift-operators whenever GatewayClasses exist. OLM merges
            # all Subscriptions in an OperatorGroup into one InstallPlan, so the RHCL
            # Subscription (Automatic) gets locked into that Manual plan, which the ingress
            # operator only approves for its own pinned version. With its own OperatorGroup
            # in kuadrant-system, RHCL has independent OLM resolution.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: kuadrant-system
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: kuadrant-operator-group
                  namespace: kuadrant-system
                spec: {}
            # RHCL — Authorino, Limitador, DNS are OLM auto-dependencies; they follow to kuadrant-system
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: rhcl-operator
                  namespace: kuadrant-system
                spec:
                  channel: stable
                  name: rhcl-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic

    # ── Group B: LWS ───────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-b
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-lws-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: lws-operator
                  namespace: openshift-lws-operator
                spec:
                  targetNamespaces:
                    - openshift-lws-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: leader-worker-set
                  namespace: openshift-lws-operator
                spec:
                  channel: stable-v1.0
                  name: leader-worker-set
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic

    # ── Group C: RHOAI (channel from site params) ──────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-c
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ods-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: rhods-operator
                  namespace: redhat-ods-operator
                spec: {}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: rhods-operator
                  namespace: redhat-ods-operator
                spec:
                  channel: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.rhoai-channel" .ManagedClusterName) hub}}'
                  name: rhods-operator
                  source: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.rhoai-source" .ManagedClusterName) hub}}'
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic
                  startingCSV: rhods-operator.3.6.0

    # ── Group D: observability (OTel + COO) ────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-d
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            # OpenTelemetry
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-opentelemetry-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: openshift-opentelemetry-operator
                  namespace: openshift-opentelemetry-operator
                spec: {}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: opentelemetry-product
                  namespace: openshift-opentelemetry-operator
                spec:
                  channel: stable
                  name: opentelemetry-product
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic
            # Cluster Observability Operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-cluster-observability-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: cluster-observability-operator
                  namespace: openshift-cluster-observability-operator
                spec: {}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: cluster-observability-operator
                  namespace: openshift-cluster-observability-operator
                spec:
                  channel: stable
                  name: cluster-observability-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic

    # ── Cleanup: remove stale RHCL and dependency Subscriptions from openshift-operators ──
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-rhcl-openshift-operators-cleanup
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: rhcl-operator
                  namespace: openshift-operators
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: authorino-operator-stable-redhat-operators-openshift-marketplace
                  namespace: openshift-operators
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: limitador-operator-stable-redhat-operators-openshift-marketplace
                  namespace: openshift-operators
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: dns-operator-stable-redhat-operators-openshift-marketplace
                  namespace: openshift-operators

    # ── Group E: CloudNativePG — moved to 01-cnpg-operator-policy.yaml (hub-only) ──

    # ── Group F: External Secrets Operator ─────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-f
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: external-secrets-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: openshift-external-secrets-operator
                  namespace: external-secrets-operator
                spec:
                  targetNamespaces: []
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-external-secrets-operator
                  namespace: external-secrets-operator
                spec:
                  channel: stable-v1
                  name: openshift-external-secrets-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic

    # ── Group F config: ExternalSecretsConfig (waits for CRD) ──────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-f-config
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "externalsecretsconfigs.operator.openshift.io") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.openshift.io/v1alpha1
                kind: ExternalSecretsConfig
                metadata:
                  name: cluster
                spec: {}
            {{- end }}

    # ── Group G: Redis operator ────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-operators-group-g
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: limitador-redis
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: limitador-redis
                  namespace: limitador-redis
                spec:
                  targetNamespaces:
                    - limitador-redis
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: redis-operator
                  namespace: limitador-redis
                spec:
                  channel: stable
                  name: redis-operator
                  source: community-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic
