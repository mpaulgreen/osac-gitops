---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-keycloak
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Provisions the Keycloak identity provider on the hub cluster:
      CNPG database role, ESO-generated secrets, cert-manager signing keys,
      Deployment, Service, Route, realm import ConfigMap, and public URL
      distribution to all sites. Hub-only deployment; public URL is all-sites.
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: osac-hub-templating
  policy-templates:
    # ── CNPG database role + database for Keycloak ─────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-keycloak-db-role
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: postgresql.cnpg.io/v1
                kind: DatabaseRole
                metadata:
                  name: keycloak
                  namespace: maas-db
                spec:
                  cluster:
                    name: maas-db
                  name: keycloak
                  login: true
                  passwordSecret:
                    name: keycloak-db
            - complianceType: musthave
              objectDefinition:
                apiVersion: postgresql.cnpg.io/v1
                kind: Database
                metadata:
                  name: keycloak
                  namespace: maas-db
                spec:
                  cluster:
                    name: maas-db
                  name: keycloak
                  owner: keycloak

    # ── ESO password generators + ExternalSecrets ──────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-keycloak-secrets
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            # Password generators
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: keycloak-db-password
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: keycloak-admin-password
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: keycloak-client-secret
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: grid-tenant-1-broker-client-secret
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: grid-tenant-2-broker-client-secret
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: grid-tenant-1-test-user-password
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: grid-tenant-2-test-user-password
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            # ExternalSecret: keycloak-db credentials
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: keycloak-db
                  namespace: maas-db
                spec:
                  refreshPolicy: CreatedOnce
                  refreshInterval: 0s
                  target:
                    name: keycloak-db
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      type: kubernetes.io/basic-auth
                      engineVersion: v2
                      mergePolicy: Merge
                      data:
                        username: keycloak
                  dataFrom:
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: keycloak-db-password
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: password
            # ExternalSecret: keycloak-secrets (admin, client, grid broker, test users)
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: keycloak-secrets
                  namespace: maas-db
                spec:
                  refreshPolicy: OnChange
                  refreshInterval: 0s
                  target:
                    name: keycloak-secrets
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      type: Opaque
                      engineVersion: v2
                      mergePolicy: Merge
                      data:
                        KC_BOOTSTRAP_ADMIN_USERNAME: admin
                        KEYCLOAK_CLIENT_ID: tenant-demo
                        KEYCLOAK_HOME_URL: http://localhost:8000
                        KEYCLOAK_REDIRECT_URI: http://localhost:8000/callback
                  dataFrom:
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: keycloak-admin-password
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: KC_BOOTSTRAP_ADMIN_PASSWORD
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: keycloak-client-secret
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: KEYCLOAK_CLIENT_SECRET
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: grid-tenant-1-broker-client-secret
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: GRID_TENANT_1_BROKER_CLIENT_SECRET
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: grid-tenant-2-broker-client-secret
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: GRID_TENANT_2_BROKER_CLIENT_SECRET
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: grid-tenant-1-test-user-password
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: GRID_TENANT_1_TEST_USER_PASSWORD
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: grid-tenant-2-test-user-password
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: GRID_TENANT_2_TEST_USER_PASSWORD

    # ── Signing key password (ESO) + cert-manager signing certificates ─
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-keycloak-signing-keys
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                metadata:
                  name: keycloak-signing-keystore-password
                  namespace: maas-db
                spec:
                  length: 48
                  digits: 8
                  symbols: 0
                  noUpper: false
                  allowRepeat: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: keycloak-signing-keystore-password
                  namespace: maas-db
                spec:
                  refreshPolicy: CreatedOnce
                  refreshInterval: 0s
                  target:
                    name: keycloak-signing-keystore-password
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      type: Opaque
                      engineVersion: v2
                      mergePolicy: Merge
                  dataFrom:
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: Password
                          name: keycloak-signing-keystore-password
                      rewrite:
                        - regexp:
                            source: ^password$
                            target: password
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Issuer
                metadata:
                  name: keycloak-signing-selfsigned
                  namespace: maas-db
                spec:
                  selfSigned: {}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: keycloak-saas-signing
                  namespace: maas-db
                spec:
                  secretName: keycloak-saas-signing
                  commonName: keycloak-saas-signing
                  duration: 87600h
                  renewBefore: 720h
                  privateKey:
                    algorithm: RSA
                    size: 2048
                    rotationPolicy: Never
                  keystores:
                    jks:
                      create: true
                      alias: saas-signing
                      passwordSecretRef:
                        name: keycloak-signing-keystore-password
                        key: password
                  issuerRef:
                    name: keycloak-signing-selfsigned
                    kind: Issuer
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: keycloak-grid-tenant-1-idp-signing
                  namespace: maas-db
                spec:
                  secretName: keycloak-grid-tenant-1-idp-signing
                  commonName: keycloak-grid-tenant-1-idp-signing
                  duration: 87600h
                  renewBefore: 720h
                  privateKey:
                    algorithm: RSA
                    size: 2048
                    rotationPolicy: Never
                  keystores:
                    jks:
                      create: true
                      alias: grid-tenant-1-idp-signing
                      passwordSecretRef:
                        name: keycloak-signing-keystore-password
                        key: password
                  issuerRef:
                    name: keycloak-signing-selfsigned
                    kind: Issuer
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: keycloak-grid-tenant-2-idp-signing
                  namespace: maas-db
                spec:
                  secretName: keycloak-grid-tenant-2-idp-signing
                  commonName: keycloak-grid-tenant-2-idp-signing
                  duration: 87600h
                  renewBefore: 720h
                  privateKey:
                    algorithm: RSA
                    size: 2048
                    rotationPolicy: Never
                  keystores:
                    jks:
                      create: true
                      alias: grid-tenant-2-idp-signing
                      passwordSecretRef:
                        name: keycloak-signing-keystore-password
                        key: password
                  issuerRef:
                    name: keycloak-signing-selfsigned
                    kind: Issuer

    # ── Keycloak realm import ConfigMap ─────────────────────────────────
    # The 3 realm JSON files are maintained separately in
    # hub/platform/keycloak-realms/ and embedded here as ConfigMap data keys.
    # The initContainer renders environment variable substitutions at startup.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-keycloak-realm-import
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: keycloak-realm-import
                  namespace: maas-db
                data:
                  saas-realm.json: |
                    {
                      "realm": "saas",
                      "keycloakVersion": "26.8.0",
                      "accessTokenLifespan": 21600,
                      "ssoSessionIdleTimeout": 21600,
                      "enabled": true,
                      "loginWithEmailAllowed": true,
                      "organizationsEnabled": true,
                      "clients": [
                        {
                          "clientId": "${KEYCLOAK_CLIENT_ID}",
                          "name": "Multi-tenant tutorial app",
                          "baseUrl": "${KEYCLOAK_HOME_URL}",
                          "enabled": true,
                          "protocol": "openid-connect",
                          "clientAuthenticatorType": "client-secret",
                          "secret": "${KEYCLOAK_CLIENT_SECRET}",
                          "publicClient": false,
                          "standardFlowEnabled": true,
                          "directAccessGrantsEnabled": false,
                          "redirectUris": ["${KEYCLOAK_REDIRECT_URI}"],
                          "defaultClientScopes": [
                            "basic",
                            "acr",
                            "profile",
                            "email",
                            "roles",
                            "web-origins"
                          ],
                          "optionalClientScopes": ["organization"],
                          "protocolMappers": [
                            {
                              "name": "MaaS tenant groups",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-usermodel-attribute-mapper",
                              "config": {
                                "user.attribute": "maas_groups",
                                "claim.name": "groups",
                                "jsonType.label": "String",
                                "multivalued": "true",
                                "id.token.claim": "true",
                                "userinfo.token.claim": "true",
                                "access.token.claim": "true"
                              }
                            },
                            {
                              "name": "MaaS organizations",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-usermodel-attribute-mapper",
                              "config": {
                                "user.attribute": "maas_orgs_json",
                                "claim.name": "https://redhat\\.com/maas/orgs",
                                "jsonType.label": "JSON",
                                "multivalued": "false",
                                "id.token.claim": "true",
                                "userinfo.token.claim": "true",
                                "access.token.claim": "true"
                              }
                            },
                            {
                              "name": "MaaS audience",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-audience-mapper",
                              "consentRequired": false,
                              "config": {
                                "included.client.audience": "tenant-demo",
                                "id.token.claim": "false",
                                "access.token.claim": "true"
                              }
                            },
                            {
                              "name": "MaaS access token purpose",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-hardcoded-claim-mapper",
                              "consentRequired": false,
                              "config": {
                                "claim.name": "token_use",
                                "claim.value": "access",
                                "jsonType.label": "String",
                                "id.token.claim": "false",
                                "access.token.claim": "true",
                                "userinfo.token.claim": "false"
                              }
                            }
                          ]
                        },
                        {
                          "clientId": "osac-cli",
                          "name": "OSAC CLI",
                          "description": "OSAC command line interface for testing",
                          "enabled": true,
                          "publicClient": true,
                          "standardFlowEnabled": true,
                          "directAccessGrantsEnabled": true,
                          "serviceAccountsEnabled": false,
                          "protocol": "openid-connect",
                          "fullScopeAllowed": true,
                          "redirectUris": ["http://localhost"],
                          "webOrigins": ["http://localhost"],
                          "defaultClientScopes": [
                            "basic",
                            "acr",
                            "profile",
                            "email",
                            "roles",
                            "web-origins"
                          ],
                          "optionalClientScopes": ["organization"],
                          "protocolMappers": [
                            {
                              "name": "MaaS tenant groups",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-usermodel-attribute-mapper",
                              "config": {
                                "user.attribute": "maas_groups",
                                "claim.name": "groups",
                                "jsonType.label": "String",
                                "multivalued": "true",
                                "id.token.claim": "true",
                                "userinfo.token.claim": "true",
                                "access.token.claim": "true"
                              }
                            },
                            {
                              "name": "MaaS audience",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-audience-mapper",
                              "consentRequired": false,
                              "config": {
                                "included.client.audience": "tenant-demo",
                                "id.token.claim": "false",
                                "access.token.claim": "true"
                              }
                            },
                            {
                              "name": "MaaS access token purpose",
                              "protocol": "openid-connect",
                              "protocolMapper": "oidc-hardcoded-claim-mapper",
                              "consentRequired": false,
                              "config": {
                                "claim.name": "token_use",
                                "claim.value": "access",
                                "jsonType.label": "String",
                                "id.token.claim": "false",
                                "access.token.claim": "true",
                                "userinfo.token.claim": "false"
                              }
                            }
                          ]
                        }
                      ],
                      "identityProviders": [
                        {
                          "alias": "grid-tenant-1",
                          "displayName": "Grid Tenant 1",
                          "providerId": "oidc",
                          "enabled": true,
                          "trustEmail": true,
                          "hideOnLogin": true,
                          "config": {
                            "clientId": "saas-broker",
                            "clientSecret": "${GRID_TENANT_1_BROKER_CLIENT_SECRET}",
                            "clientAuthMethod": "client_secret_post",
                            "issuer": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-1-idp",
                            "authorizationUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-1-idp/protocol/openid-connect/auth",
                            "tokenUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-1-idp/protocol/openid-connect/token",
                            "userInfoUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-1-idp/protocol/openid-connect/userinfo",
                            "logoutUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-1-idp/protocol/openid-connect/logout",
                            "jwksUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-1-idp/protocol/openid-connect/certs",
                            "useJwksUrl": "true",
                            "validateSignature": "true",
                            "defaultScope": "openid email profile"
                          }
                        },
                        {
                          "alias": "grid-tenant-2",
                          "displayName": "Grid Tenant 2",
                          "providerId": "oidc",
                          "enabled": true,
                          "trustEmail": true,
                          "hideOnLogin": true,
                          "config": {
                            "clientId": "saas-broker",
                            "clientSecret": "${GRID_TENANT_2_BROKER_CLIENT_SECRET}",
                            "clientAuthMethod": "client_secret_post",
                            "issuer": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-2-idp",
                            "authorizationUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-2-idp/protocol/openid-connect/auth",
                            "tokenUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-2-idp/protocol/openid-connect/token",
                            "userInfoUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-2-idp/protocol/openid-connect/userinfo",
                            "logoutUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-2-idp/protocol/openid-connect/logout",
                            "jwksUrl": "${KEYCLOAK_PUBLIC_URL}/realms/grid-tenant-2-idp/protocol/openid-connect/certs",
                            "useJwksUrl": "true",
                            "validateSignature": "true",
                            "defaultScope": "openid email profile"
                          }
                        }
                      ],
                      "identityProviderMappers": [
                        {
                          "name": "Grid Tenant 1 groups",
                          "identityProviderAlias": "grid-tenant-1",
                          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                          "config": {
                            "claim": "groups",
                            "user.attribute": "maas_groups",
                            "syncMode": "FORCE"
                          }
                        },
                        {
                          "name": "Grid Tenant 1 organizations transport",
                          "identityProviderAlias": "grid-tenant-1",
                          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                          "config": {
                            "claim": "https://redhat\\.com/maas/orgs",
                            "user.attribute": "maas_orgs_json",
                            "syncMode": "FORCE"
                          }
                        },
                        {
                          "name": "Grid Tenant 2 groups",
                          "identityProviderAlias": "grid-tenant-2",
                          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                          "config": {
                            "claim": "groups",
                            "user.attribute": "maas_groups",
                            "syncMode": "FORCE"
                          }
                        },
                        {
                          "name": "Grid Tenant 2 organizations transport",
                          "identityProviderAlias": "grid-tenant-2",
                          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                          "config": {
                            "claim": "https://redhat\\.com/maas/orgs",
                            "user.attribute": "maas_orgs_json",
                            "syncMode": "FORCE"
                          }
                        }
                      ],
                      "components": {
                        "org.keycloak.keys.KeyProvider": [
                          {
                            "id": "c20d0bd2-97fa-4e59-98df-5c9c873bfc66",
                            "name": "saas-signing",
                            "providerId": "java-keystore",
                            "subComponents": {},
                            "config": {
                              "kid": ["c20d0bd2-97fa-4e59-98df-5c9c873bfc66"],
                              "priority": ["1000"],
                              "enabled": ["true"],
                              "active": ["true"],
                              "algorithm": ["RS256"],
                              "keyUse": ["SIG"],
                              "keystore": ["/opt/keycloak/data/saas/keystore.jks"],
                              "keystoreType": ["JKS"],
                              "keystorePassword": ["${KEYCLOAK_SIGNING_KEYSTORE_PASSWORD}"],
                              "keyAlias": ["saas-signing"],
                              "keyPassword": ["${KEYCLOAK_SIGNING_KEYSTORE_PASSWORD}"]
                            }
                          }
                        ],
                        "org.keycloak.userprofile.UserProfileProvider": [
                          {
                            "id": "b5919e8a-046d-47e7-8a2c-f30f5ff12000",
                            "providerId": "declarative-user-profile",
                            "subComponents": {},
                            "config": {
                              "config-pieces-count": ["1"],
                              "config-piece-0": ["{\"unmanagedAttributePolicy\":\"ADMIN_EDIT\"}"]
                            }
                          }
                        ]
                      },
                      "organizations": [
                        {
                          "name": "Grid Tenant 1",
                          "alias": "grid-tenant-1",
                          "enabled": true,
                          "domains": [
                            {
                              "name": "grid-tenant-1.test",
                              "verified": false,
                              "identityProviderAlias": "grid-tenant-1",
                              "autoRedirect": true
                            }
                          ],
                          "identityProviders": [
                            {
                              "alias": "grid-tenant-1",
                              "organizationLinks": [
                                {
                                  "autoMembership": true,
                                  "membershipType": "UNMANAGED"
                                }
                              ]
                            }
                          ]
                        },
                        {
                          "name": "Grid Tenant 2",
                          "alias": "grid-tenant-2",
                          "enabled": true,
                          "domains": [
                            {
                              "name": "grid-tenant-2.test",
                              "verified": false,
                              "identityProviderAlias": "grid-tenant-2",
                              "autoRedirect": true
                            }
                          ],
                          "identityProviders": [
                            {
                              "alias": "grid-tenant-2",
                              "organizationLinks": [
                                {
                                  "autoMembership": true,
                                  "membershipType": "UNMANAGED"
                                }
                              ]
                            }
                          ]
                        }
                      ],
                      "users": [
                        {
                          "username": "novatech-admin",
                          "firstName": "NovaTech",
                          "lastName": "Admin",
                          "email": "novatech-admin@novatech.com",
                          "emailVerified": true,
                          "enabled": true,
                          "credentials": [{"type": "password", "value": "password123", "temporary": false}],
                          "attributes": {
                            "maas_groups": ["novatech-platform-admins"]
                          }
                        },
                        {
                          "username": "novatech-free",
                          "firstName": "NovaTech",
                          "lastName": "Free",
