---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-prerequisites
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Deploys the RHOAI 3.6 nightly prerequisites on each site: the FBC
      CatalogSource, ImageDigestMirrorSet for quay.io image mirrors, and
      the Quay pull-secret distribution. Must converge before Policy 01
      so OLM can resolve the RHOAI 3.6 Subscription from the nightly catalog.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Image mirrors (cluster-scoped) ──────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-image-mirrors
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: DeleteAll
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ImageDigestMirrorSet
                metadata:
                  name: quay-registry
                spec:
                  imageDigestMirrors:
                    - source: registry.redhat.io/rhoai
                      mirrors:
                        - quay.io/rhoai
                      mirrorSourcePolicy: NeverContactSource
                    - source: registry.redhat.io/rhaii
                      mirrors:
                        - registry.stage.redhat.io/rhaii
                      mirrorSourcePolicy: NeverContactSource
                    - source: registry.redhat.io/rhaii-early-access
                      mirrors:
                        - registry.stage.redhat.io/rhaii-early-access
                      mirrorSourcePolicy: NeverContactSource
                    - source: registry.redhat.io/rhaii-fast
                      mirrors:
                        - registry.stage.redhat.io/rhaii-fast
                      mirrorSourcePolicy: NeverContactSource

    # ── FBC CatalogSource ───────────────────────────────────────────────
    # Disabled: the nightly FBC image requires a Quay pull secret with
    # valid credentials. Set back to enforce once the secret is refreshed.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-fbc-catalog
        spec:
          remediationAction: inform
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: rhoai-catalog-dev
                  namespace: openshift-marketplace
                imagePullSecrets:
                  - name: rhoai-catalog-pull-secret
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: rhoai-catalog-dev
                  namespace: openshift-marketplace
                spec:
                  displayName: RHOAI 3.6 Nightly (FBC)
                  publisher: Red Hat
                  sourceType: grpc
                  image: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.rhoai-fbc-image" .ManagedClusterName) hub}}'
                  secrets:
                    - rhoai-catalog-pull-secret
                  updateStrategy:
                    registryPoll:
                      interval: 15m

    # ── Quay pull secret distribution (hub → managed) ───────────────────
    # The source secret rhoai-quay-pull-secret is created manually on the
    # hub in osac-platform; it is never in Git (P9). The guard ensures the
    # template does not error before the secret exists.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-catalog-pull-secret
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{hub- if (lookup "v1" "Secret" "osac-platform" "rhoai-quay-pull-secret") hub}}
            {{hub- if (fromSecret "osac-platform" "rhoai-quay-pull-secret" ".dockerconfigjson") hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: rhoai-catalog-pull-secret
                  namespace: openshift-marketplace
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: '{{hub fromSecret "osac-platform" "rhoai-quay-pull-secret" ".dockerconfigjson" hub}}'
            {{hub- end hub}}
            {{hub- end hub}}

    # ── Merge quay.io/rhoai auth into global pull-secret ────────────────
    # Managed-side template: reads the distributed catalog pull secret and
    # the cluster's existing global pull-secret, merges the quay.io/rhoai
    # auth entry, and writes the merged result back.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-global-pull-secret-merge
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $sourceSecret := lookup "v1" "Secret" "openshift-marketplace" "rhoai-catalog-pull-secret" -}}
            {{- $globalSecret := lookup "v1" "Secret" "openshift-config" "pull-secret" -}}
            {{- if and $sourceSecret $globalSecret -}}
            {{- $sourceConfig := fromSecret "openshift-marketplace" "rhoai-catalog-pull-secret" ".dockerconfigjson" | base64dec | fromJson -}}
            {{- $globalConfig := fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" | base64dec | fromJson -}}
            {{- $sourceAuths := index $sourceConfig "auths" -}}
            {{- $sourceAuth := index $sourceAuths "quay.io/rhoai" -}}
            {{- if not $sourceAuth -}}
            {{- $sourceAuth = index $sourceAuths "quay.io" -}}
            {{- end -}}
            {{- $mergedAuths := mustMerge (index $globalConfig "auths") (dict "quay.io/rhoai" $sourceAuth) -}}
            {{- $mergedConfig := mustMerge $globalConfig (dict "auths" $mergedAuths) -}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: pull-secret
                  namespace: openshift-config
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: '{{ $mergedConfig | toJson | base64enc }}'
            {{- end -}}
