---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-grid-network
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Per-site grid operator prerequisites: supplementary RBAC (list/watch
      configmaps+secrets), operator config (site name + signer endpoint),
      and the GridNetwork CR. Signal transport is poll mode, peer trust is
      SPIFFE.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Grid Operator RBAC supplement ─────────────────────────────────
    # The AIGateway controller creates ClusterRole grid-operator-resources
    # but omits list/watch on configmaps and secrets (RHOAI 3.6 bug).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-operator-rbac
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: osac-grid-operator-supplement
                rules:
                  - apiGroups: [""]
                    resources: ["configmaps", "secrets"]
                    verbs: ["list", "watch"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: osac-grid-operator-supplement
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: osac-grid-operator-supplement
                subjects:
                  - kind: ServiceAccount
                    name: grid-operator
                    namespace: redhat-ai-grid

    # ── Grid Operator Site Name ──────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-operator-site-name
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: grid-operator
                  namespace: redhat-ai-grid
                spec:
                  template:
                    spec:
                      containers:
                        - name: operator
                          env:
                            - name: GRID_SITE_NAME
                              value: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-operator-site-name" .ManagedClusterName) hub}}'
                            - name: GRID_SIGNALS_ADVERTISE_ADDR
                              value: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-signals-ext-host" .ManagedClusterName) hub}}'

    # ── Grid Operator Config ─────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-operator-config
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: grid-operator-config
                  namespace: redhat-ai-grid
                data:
                  config.yaml: |
                    site:
                      name: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-operator-site-name" .ManagedClusterName) hub}}'
                      signerEndpoint:
                        url: 'https://{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-enrollment-host" .ManagedClusterName) hub}}'
                        caBundleRef:
                          kind: Secret
                          name: grid-enrollment-ca
                          key: ca.crt
                      inviteSecretRef:
                        name: grid-enrollment-invite
                        key: token

    # ── Enrollment invite token (spoke sites) ─────────────────────────
    # Reads the mirrored invite token from osac-platform and creates it
    # on each spoke site so the grid-operator can enroll with the hub.
    # Skipped for local-cluster (the hub bootstraps its own identity).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-invite
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{hub- $siteName := fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-site-name" .ManagedClusterName) hub}}
            {{hub- $token := fromSecret "osac-platform" (printf "grid-invite-%s-mirror" $siteName) "token" hub}}
            {{hub- if and (ne .ManagedClusterName "local-cluster") (ne $token "") hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-enrollment-invite
                  namespace: redhat-ai-grid
                  labels:
                    grid.praxis.fast/site: '{{hub $siteName hub}}'
                type: Opaque
                data:
                  token: '{{hub $token hub}}'
            {{hub- end hub}}

    # ── Enrollment CA bundle (spoke sites) ────────────────────────────
    # The enrollment TLS cert is signed by the grid CA, and the spoke
    # operator uses caBundleRef as BOTH the TLS verification CA and
    # the pinned grid CA.  Distributing the grid CA satisfies both.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-enrollment-ca
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{hub- $caCert := fromSecret "osac-platform" "grid-ca-mirror" "ca.crt" hub}}
            {{hub- if and (ne .ManagedClusterName "local-cluster") (ne $caCert "") hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-enrollment-ca
                  namespace: redhat-ai-grid
                  labels:
                    grid.praxis.fast/signer-bundle: "true"
                type: Opaque
                data:
                  ca.crt: '{{hub $caCert hub}}'
            {{hub- end hub}}

    # ── External SWIM NLB ────────────────────────────────────────────
    # RHOAI 3.6's AIGateway creates grid-operator-swim with
    # externalTrafficPolicy: Local + healthCheckNodePort, making NLBs
    # viable for UDP SWIM (unlike the POC where TCP health checks failed
    # for UDP-only services). Override the internal annotation so the
    # operator discovers a public IP and remote peers can reach SWIM.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-swim-external-nlb
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-operator-swim
                  namespace: redhat-ai-grid
                  annotations:
                    service.beta.kubernetes.io/aws-load-balancer-internal: "false"

    # ── Submariner SWIM Service + Export (fallback) ────────────────────
    # Kept as fallback: ClusterIP Service + ServiceExport gives a
    # GlobalIngressIP reachable via IPsec tunnel if external NLBs fail.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-swim-submariner
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-swim-sub
                  namespace: redhat-ai-grid
                spec:
                  type: ClusterIP
                  publishNotReadyAddresses: true
                  selector:
                    app.kubernetes.io/instance: grid-operator
                    app.kubernetes.io/name: grid-operator
                  ports:
                    - name: swim-udp
                      port: 7946
                      targetPort: swim-udp
                      protocol: UDP
            {{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "serviceexports.multicluster.x-k8s.io") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: multicluster.x-k8s.io/v1alpha1
                kind: ServiceExport
                metadata:
                  name: grid-swim-sub
                  namespace: redhat-ai-grid
            {{- end }}

    # ── External signals NLB ─────────────────────────────────────────
    # Signals transport (TCP 9091, poll mode) works over external NLBs.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-grid-signals-external-nlb
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: grid-signals-ext
                  namespace: redhat-ai-grid
                  annotations:
                    service.beta.kubernetes.io/aws-load-balancer-type: nlb
                    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
                spec:
                  type: LoadBalancer
                  externalTrafficPolicy: Local
                  publishNotReadyAddresses: true
                  selector:
                    app.kubernetes.io/instance: grid-operator
                    app.kubernetes.io/name: grid-operator
                  ports:
                    - name: signals
                      port: 9091
                      targetPort: signals
                      protocol: TCP

    # ── GridNetwork CR ────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-gridnetwork-cr
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: GridNetwork
                metadata:
                  name: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-network-name" .ManagedClusterName) hub}}'
                spec:
                  gridId: '{{hub fromConfigMap "osac-platform" "osac-site-params" "grid.id" hub}}'
                  seeds:
                    - '{{hub fromConfigMap "osac-platform" "osac-site-params" "grid.hub-swim-host" hub}}:7946'
                  swim:
                    suspicionTimeout: 1h
                  signalTransport:
                    mode: poll
                  peerTrust:
                    mode: spiffe
                  tls:
                    siteSecretRef:
                      name: grid-site-identity
                      namespace: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-namespace" .ManagedClusterName) hub}}'
                    caSecretRef:
                      name: grid-ca
                      namespace: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-namespace" .ManagedClusterName) hub}}'
                  consumerGateways:
                    - name: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-gateway-name" .ManagedClusterName) hub}}'
                      namespace: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-namespace" .ManagedClusterName) hub}}'
                      siteName: '{{hub fromConfigMap "osac-platform" "osac-site-params" (printf "%s.grid-site-name" .ManagedClusterName) hub}}'
