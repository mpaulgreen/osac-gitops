---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-submariner
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Provisions Submariner cross-cluster networking: the default-broker
      namespace, the Submariner Broker with Globalnet enabled, the
      globalnet-info ConfigMap, and per-site ManagedClusterAddOn +
      SubmarinerConfig deployed via hub templates.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Broker namespace ──────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-submariner-broker-ns
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: default-broker

    # ── Submariner Broker ─────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-submariner-broker
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: submariner.io/v1alpha1
                kind: Broker
                metadata:
                  name: submariner-broker
                  namespace: default-broker
                  labels:
                    cluster.open-cluster-management.io/backup: submariner
                spec:
                  globalnetEnabled: true
                  globalnetCIDRRange: 242.0.0.0/8
                  defaultGlobalnetClusterSize: 65536

    # ── Globalnet info ConfigMap ──────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-submariner-globalnet-info
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: submariner-globalnet-info
                  namespace: default-broker
                  labels:
                    cluster.open-cluster-management.io/backup: submariner
                    component: submariner-globalnet
                data:
                  globalnetEnabled: "true"
                  globalnetCidrRange: '"242.0.0.0/8"'
                  globalnetClusterSize: "65536"

    # ── Gateway node labels ────────────────────────────────────────────
    # Label worker nodes as Submariner gateways so the operator knows
    # which nodes to use for cross-cluster tunnels.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-submariner-gateway-labels
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- range (lookup "v1" "Node" "" "").items }}
            {{- if (hasKey .metadata.labels "node-role.kubernetes.io/worker") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Node
                metadata:
                  name: {{ .metadata.name }}
                  labels:
                    submariner.io/gateway: "true"
            {{- end }}
            {{- end }}
---
# Hub-only: ManagedClusterAddOn and SubmarinerConfig are hub-side
# resources that live in each managed cluster's namespace on the hub.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-submariner-addon
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Hub-only: creates per-site ManagedClusterAddOn and SubmarinerConfig
      in each managed cluster's namespace on the hub.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-submariner-site-addon
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{hub- range (splitList "," (fromConfigMap "osac-platform" "osac-site-params" "submariner.clusters")) hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: addon.open-cluster-management.io/v1alpha1
                kind: ManagedClusterAddOn
                metadata:
                  name: submariner
                  namespace: '{{hub . hub}}'
                spec:
                  installNamespace: submariner-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: submarineraddon.open-cluster-management.io/v1alpha1
                kind: SubmarinerConfig
                metadata:
                  name: submariner
                  namespace: '{{hub . hub}}'
                spec:
                  loadBalancerEnable: true
                  gatewayConfig:
                    gateways: 2
            {{hub- end hub}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: osac-submariner-addon
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: osac-hub-only
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: osac-submariner-addon
