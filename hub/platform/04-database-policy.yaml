---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-database
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Provisions the CloudNativePG database cluster for the MaaS gateway.
      CNPG auto-generates credentials in maas-db-app; a managed-side template
      derives the connection URL for redhat-ai-gateway-infra. No secret value
      is in Git or in the hub Policy.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Namespaces ──────────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-database-namespaces
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: maas-db
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ai-gateway-infra
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ods-applications

    # ── CloudNativePG Cluster ───────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-cnpg-cluster
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                metadata:
                  name: maas-db
                  namespace: maas-db
                spec:
                  instances: 3
                  certificates:
                    serverAltDNSNames:
                      - maas-db-rw.maas-db.svc.clusterset.local
                  bootstrap:
                    initdb:
                      database: maas
                      owner: maas_api
                  storage:
                    size: 20Gi
                  resources:
                    requests:
                      cpu: 250m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  affinity:
                    enablePodAntiAffinity: true
                    topologyKey: kubernetes.io/hostname
                    podAntiAffinityType: preferred

    # ── Database connection URL (managed-side template) ─────────────────
    # Reads CNPG-generated credentials from maas-db-app and creates the
    # connection URL secret that the MaaS gateway expects.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-database-connection
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $creds := lookup "v1" "Secret" "maas-db" "maas-db-app" -}}
            {{- if $creds -}}
            {{- $user := base64dec $creds.data.username -}}
            {{- $pw := base64dec $creds.data.password -}}
            {{- $db := "maas" -}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-config
                  namespace: redhat-ai-gateway-infra
                type: Opaque
                data:
                  DB_CONNECTION_URL: {{ printf "postgresql://%s:%s@maas-db-rw.maas-db.svc:5432/%s?sslmode=verify-ca" $user $pw $db | base64enc }}
            {{- end -}}
