---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: osac-database
  namespace: osac-platform
  labels:
    osac.io/platform: "true"
  annotations:
    policy.open-cluster-management.io/description: >-
      Creates the namespaces used by the MaaS database and gateway infrastructure
      on every managed cluster. The CNPG primary and Keycloak run hub-only
      (see osac-database-hub policy).
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # ── Namespaces (all sites) ──────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: osac-database-namespaces
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: maas-db
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ai-gateway-infra
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ods-applications

