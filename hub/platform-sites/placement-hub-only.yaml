---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: osac-hub-only
  namespace: osac-platform
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - local-cluster
