---
# Rendered by the Site adapter. One key per site; platform policies read
# these values via hub-template fromConfigMap lookups.
#
# Identity: every site uses the one Keycloak on the hub (site-a), realm osac.
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-site-params
  namespace: osac-platform
data:
  # --- local-cluster: site-a, the hub (hub), CPU only ---
  local-cluster.rhoai-channel: "stable-3.6"
  local-cluster.rhoai-source: "rhoai-catalog-dev"
  local-cluster.rhoai-fbc-image: "quay.io/rhoai/rhoai-fbc-fragment:rhoai-3.6@sha256:58f8056d17a1092b05e3de859234e82ef3e208de43bc52176a56587cc50dfa6f"
  local-cluster.cluster-domain: "apps.hub.kni.syseng.devcluster.openshift.com"
  local-cluster.identity-issuer: "https://keycloak.apps.hub.kni.syseng.devcluster.openshift.com/realms/saas"
  local-cluster.grid-enabled: "true"
  local-cluster.grid-site-name: "local-cluster"
  local-cluster.grid-network-name: "grid"
  local-cluster.grid-gateway-name: "grid-gateway"
  local-cluster.grid-namespace: "redhat-ai-grid"
  local-cluster.hardware-profiles: |
    [
      {
        "name": "cpu-only", "display_name": "CPU Only",
        "cpu_default": 4, "cpu_min": 2, "cpu_max": 8,
        "memory_default": "16Gi", "memory_min": "8Gi", "memory_max": "32Gi"
      }
    ]
  # --- site-b: spoke (site-b-cluster), workers are g5.2xlarge: 1x NVIDIA A10G (24GB), 8 vCPU, 32 GiB ---
  site-b.rhoai-channel: "stable-3.6"
  site-b.rhoai-source: "rhoai-catalog-dev"
  site-b.rhoai-fbc-image: "quay.io/rhoai/rhoai-fbc-fragment:rhoai-3.6@sha256:58f8056d17a1092b05e3de859234e82ef3e208de43bc52176a56587cc50dfa6f"
  site-b.cluster-domain: "apps.osacmaas.kni.syseng.devcluster.openshift.com"
  site-b.identity-issuer: "https://keycloak.apps.hub.kni.syseng.devcluster.openshift.com/realms/saas"
  site-b.grid-enabled: "true"
  site-b.grid-site-name: "site-b"
  site-b.grid-network-name: "grid"
  site-b.grid-gateway-name: "grid-gateway"
  site-b.grid-namespace: "redhat-ai-grid"
  site-b.hardware-profiles: |
    [
      {
        "name": "nvidia-a10g-24gb", "display_name": "NVIDIA A10G (24GB)",
        "accelerator_id": "nvidia.com/gpu", "accelerator_name": "NVIDIA A10G", "gpu_count": 1, "gpu_max": 1,
        "cpu_default": 4, "cpu_min": 2, "cpu_max": 6,
        "memory_default": "16Gi", "memory_min": "8Gi", "memory_max": "24Gi",
        "node_selectors": {"nvidia.com/gpu.present": "true"},
        "tolerations": [{"key": "nvidia.com/gpu", "operator": "Exists", "effect": "NoSchedule"}]
      },
      {
        "name": "cpu-only", "display_name": "CPU Only",
        "cpu_default": 4, "cpu_min": 2, "cpu_max": 8,
        "memory_default": "16Gi", "memory_min": "8Gi", "memory_max": "32Gi"
      }
    ]
