---
# Applied by bootstrap.sh with REPO_URL and GIT_BRANCH substituted.
# This file is the reference copy; the script inlines the same spec.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: osac-layers
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - git:
        repoURL: REPO_URL_PLACEHOLDER
        revision: GIT_BRANCH_PLACEHOLDER
        files:
          - path: '**/*.app.json'
  templatePatch: |
    metadata:
      name: '{{ if eq .scope.kind "tenant" }}{{ .scope.kind }}-{{ .scope.id }}-{{ .site }}-{{ .layer }}{{ else }}{{ .scope.kind }}-{{ .site }}-{{ .layer }}{{ end }}'
  template:
    metadata:
      name: placeholder
    spec:
      project: '{{ .project }}'
      source:
        repoURL: REPO_URL_PLACEHOLDER
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .manifestPath }}'
        directory:
          recurse: true
          include: '*.yaml'
      destination:
        name: '{{ .argoDestination }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
