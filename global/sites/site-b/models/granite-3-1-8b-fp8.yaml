---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: granite-3-1-8b-fp8
  namespace: ai-grid-internal-models
spec:
  baseRefs:
    - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    name: granite-3.1-8b-instruct-fp8
    uri: oci://quay.io/mpaulgreen/granite-3.1-8b-instruct-fp8:gori-1.0
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway:
      refs:
        - name: openshift-ai-inference
          namespace: openshift-ingress
  template:
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    containers:
      - name: main
        args:
          - --max-model-len=4096
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "6"
            memory: 24Gi
            nvidia.com/gpu: "1"
